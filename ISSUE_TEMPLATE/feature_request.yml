name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make Grimoire better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or frustration that led to this idea. A clear "why" helps a lot.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind. Plain language is great — no need to be technical.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have you found any workarounds?
      description: If you've found a way to work around the problem today, mention it here.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, screenshots, links to similar features in other tools, or any other context.
