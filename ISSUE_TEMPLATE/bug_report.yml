name: Bug Report
description: Something isn't working the way it should
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you can
        provide, the easier it is to track down and fix.

        > If this is about the Grimoire app specifically, the
        > [grimoire repo](https://github.com/grimoire-codex/grimoire/issues/new/choose)
        > has a more detailed bug form.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem. What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Walk us through exactly how to make the problem happen.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit you're on, if applicable.
      placeholder: "e.g. latest, v1.2.0, or abc1234"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: |
        Paste any error messages or logs. This field is formatted as code
        automatically — no need to add backticks.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, unusual configuration, or anything else that might be relevant.
